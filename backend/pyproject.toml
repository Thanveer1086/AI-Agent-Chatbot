[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend orchestrating LangGraph, MCP Gateway, and Advanced RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=1.40.0",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "docling>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
