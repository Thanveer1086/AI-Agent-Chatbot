server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Built JS/CSS have a content hash in the filename (index-AbC123.js), so a new build
    # always gets a new URL: these can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and every client-side route that falls back to it) must always be
    # revalidated; otherwise browsers keep loading the OLD bundle after a deploy.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
